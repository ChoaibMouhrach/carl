name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-setup

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-setup

      - name: Install Playwright browser
        working-directory: apps/e2e
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Migrate database
        working-directory: apps/server
        run: bun run db:migrate

      - name: Read API_PORT
        run: grep '^API_PORT=' .env >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Build and run the real docucy image (server + client + front, one
      # origin) instead of driving three separate dev processes — matches
      # production and avoids dev-server flakiness. Postgres/redis are
      # already up and healthy at this point (started by ci-setup, from
      # the same compose project), so this only builds and starts the app
      # container. POSTGRES_HOST/REDIS_HOST are overridden to the sibling
      # containers' names since the app runs on the docker network, not
      # the runner's host network where .env's "localhost" resolves.
      - name: Build and start docucy
        run: |
          POSTGRES_HOST=docucy-postgres REDIS_HOST=docucy-redis \
            docker compose -f compose.prod.yml --env-file .env up -d --build docucy s3rver

      - name: Wait for docucy
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${API_PORT}/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "docucy did not become ready" >&2
          docker compose -f compose.prod.yml logs docucy
          exit 1

      - name: Run E2E tests
        working-directory: apps/e2e
        env:
          E2E_BASE_URL: http://localhost:${{ env.API_PORT }}
        run: bun run e2e

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Create .env from secrets
        run: |
          echo '${{ toJson(secrets) }}' | jq -r 'to_entries[] | select(.key != "github_token") | "\(.key)=\(.value)"' > .env

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/docucy:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/docucy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
