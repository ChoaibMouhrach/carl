name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # compose.yml interpolates these, so the env must exist before it starts.
      - name: Create test env
        run: cp .env.ci .env

      - name: Start containers
        run: docker compose --env-file .env up -d

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            pg_ready=$(docker exec saas-template-postgres pg_isready -U postgres 2>/dev/null && echo ok || true)
            redis_ready=$(docker exec saas-template-redis redis-cli -a test-redis-password ping 2>/dev/null || true)
            if [ -n "$pg_ready" ] && echo "$redis_ready" | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "Services did not become ready" >&2
          docker compose logs
          exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Create test env
        run: cp .env.ci .env

      - name: Start containers
        run: docker compose --env-file .env up -d

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            pg_ready=$(docker exec saas-template-postgres pg_isready -U postgres 2>/dev/null && echo ok || true)
            redis_ready=$(docker exec saas-template-redis redis-cli -a test-redis-password ping 2>/dev/null || true)
            if [ -n "$pg_ready" ] && echo "$redis_ready" | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "Services did not become ready" >&2
          docker compose logs
          exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: apps/e2e
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Migrate database
        working-directory: apps/server
        run: bun run db:migrate

      - name: Run E2E tests
        working-directory: apps/e2e
        run: bun run e2e

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Create .env from secrets
        run: |
          echo '${{ toJson(secrets) }}' | jq -r 'to_entries[] | select(.key != "github_token") | "\(.key)=\(.value)"' > .env

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/saas-template:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/saas-template:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
