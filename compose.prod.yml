services:
  postgres:
    container_name: docucy-postgres
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?POSTGRES_PASS is required}
      POSTGRES_DB: ${POSTGRES_NAME:?POSTGRES_NAME is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_NAME:?POSTGRES_NAME is required}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    container_name: docucy-redis
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # S3rverStorage (the non-production storage backend) hardcodes its
  # endpoint to http://localhost:4566, so docucy shares this container's
  # network namespace instead of talking to it over the compose network.
  s3rver:
    container_name: docucy-s3rver
    build:
      context: ./apps/s3rver
    ports:
      - "${API_PORT:?API_PORT is required}:${API_PORT:?API_PORT is required}"
      # Presigned S3 URLs point browsers straight at this port, so it must
      # be reachable from outside the container too, not just from docucy.
      - "4566:4566"

  docucy:
    container_name: docucy
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "service:s3rver"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST is required}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3rver:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
